services:
  db:
    image: postgres:16-alpine
    container_name: myasna-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myasna
      POSTGRES_PASSWORD: myasna
      POSTGRES_DB: myasna
    ports:
      - '5432:5432'
    volumes:
      - myasna-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myasna']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  myasna-pgdata:
